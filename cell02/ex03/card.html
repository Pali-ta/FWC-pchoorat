<!DOCTYPE html>
<html>
<head>
    <title>User profile card</title>
    <link rel="stylesheet" href="card.css">
</head>
</html>
<body>
    <div class="card">
        <table class="profile-table">
            <tr>
                <td class="header">
                    <h2>User Profile Card</h2>
                </td>
            </tr>

            <tr>
                <td class="center-content">
                    <img src="It's_me.jpg" alt="Profile Picture" class="profile-img">
                </td>
            </tr>

            <tr>
                <td class="center-content">
                    <h3 class="login">pchoorat</h3>
                </td>
            </tr>

            <tr>
                <td class="center-content">
                    <p class="description">Yak Pen Sed Tee</p>
                </td>
            </tr>

            <tr>
                <td class="center-content social-icons">
                    <a href="https://www.instagram.com/gn_sxp/" target="_blank"><img src="IG.webp" alt="IG"></a>
                    <a href="https://github.com/Pali-ta/FWC-pchoorat" target="_blank"><img src="github-logo-git-hub-icon-on-white-background-free-vector.jpg" alt="GitHub"></a>
                </td>
            </tr>

            <tr>
                <td class="center-content">
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>
</body>
