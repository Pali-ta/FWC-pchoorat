<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>It's over 9000</title>
    <link rel="stylesheet" href="calc.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div class="calculator">
        <input type="text" id="left" placeholder="Left member">
        
        <select id="op">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>

        <input type="text" id="right" placeholder="Right member">

        <input type="submit" id="btn" value="Try me!">
    </div>

    <script src="calc.js"></script>
</body>
</html>
