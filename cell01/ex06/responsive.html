<!DOCTYPE html>
<html>
<head>
    <title>Responsive</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            text-align: center;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td style="background-color: #a2b969;">
                Pali
            </td>
            <td style="background-color: #fcd2a2;">
                Ta
            </td>
        </tr>
    </table>

</body>
</html>
